name: Build PyBroma
on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
        python-version: ["3.12", "3.13", "3.14"]

    name: Build ${{ matrix.config.name }} for ${{ matrix.python-version }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install scikit-build cython wheel cmake ninja

      - name: Build
        run: pip wheel . --no-deps --wheel-dir dist

      - name: Install build tool (for sdist)
        if: matrix.config.name == 'Linux' && matrix.python-version == '3.14'
        run: pip install build

      - name: Build sdist
        if: matrix.config.name == 'Linux' && matrix.python-version == '3.14'
        run: python -m build --sdist --outdir dist

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: pybroma-${{ matrix.config.name }}-${{ matrix.python-version }}
          path: |
            dist/*.whl
            dist/*.tar.gz